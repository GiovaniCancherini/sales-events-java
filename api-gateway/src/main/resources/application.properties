spring.application.name=api-gateway
server.port=8080

# /api/orders/** -> order-service /orders/** (o prefixo /api é do gateway, não do serviço)
spring.cloud.gateway.server.webflux.routes[0].id=orders
spring.cloud.gateway.server.webflux.routes[0].uri=${ORDER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/orders/**,/api/orders
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# CORS num lugar só: as origens dos front-ends (shell e remotes); os serviços não precisam saber delas
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_ORIGINS:http://localhost:4200,http://localhost:4201}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Content-Type,X-Correlation-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=X-Correlation-Id

# /actuator/prometheus: o formato que o Prometheus lê (modelo pull); o LGTM recebe as mesmas métricas por OTLP (push)
management.endpoints.web.exposure.include=health,info,prometheus

# Traces (ADR 12): o gateway abre o trace e o repassa ao order-service no header traceparent.
management.tracing.sampling.probability=1.0
# Métricas por OTLP só quando há para onde mandar: o docker-compose.tools.yml liga e aponta para o LGTM.
management.otlp.metrics.export.enabled=false
# Histograma por endpoint, para calcular p95 e p99 no Prometheus (média esconde a cauda)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
