spring.application.name=inventory-service
server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/inventory
spring.datasource.username=inventory
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}
# Cria o DLT na subida; sem Kafka, o serviço não sobe
spring.kafka.admin.fail-fast=true
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Mensagem que não desserializa vira erro tratado e vai para o DLT, sem travar a partição
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=\
  created:com.giovanicancherini.inventoryservice.event.OrderCreatedEvent,\
  updated:com.giovanicancherini.inventoryservice.event.OrderUpdatedEvent,\
  cancelled:com.giovanicancherini.inventoryservice.event.OrderCancelledEvent
# Mantém o header de tipo depois de desserializar: o DLT o copia, e a mensagem pode ser reprocessada
spring.kafka.consumer.properties.spring.json.remove.type.headers=false

app.kafka.topic.orders=orders
app.kafka.topic.orders-dead-letter=orders.DLT

management.endpoints.web.exposure.include=health,info

# Traces (ADR 12): o listener continua o trace que chega no header traceparent da mensagem.
spring.kafka.listener.observation-enabled=true
management.tracing.sampling.probability=1.0
management.tracing.baggage.remote-fields=X-Correlation-Id
management.tracing.baggage.correlation.fields=X-Correlation-Id
logging.pattern.correlation=[%X{traceId:-},%X{spanId:-},%X{X-Correlation-Id:-}] 
# Métricas por OTLP só quando há para onde mandar: o docker-compose.tools.yml liga e aponta para o LGTM.
management.otlp.metrics.export.enabled=false
