spring.application.name=inventory-service
server.port=8082

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Mensagem que não desserializa vira erro tratado, sem travar a partição
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=\
  created:com.giovanicancherini.inventoryservice.event.OrderCreatedEvent,\
  updated:com.giovanicancherini.inventoryservice.event.OrderUpdatedEvent,\
  cancelled:com.giovanicancherini.inventoryservice.event.OrderCancelledEvent

app.kafka.topic.orders=orders

management.endpoints.web.exposure.include=health,info
