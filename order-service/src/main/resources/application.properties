spring.application.name=order-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/orders
spring.datasource.username=orders
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}
spring.kafka.admin.fail-fast=true
# O payload já sai do outbox em JSON; o token de tipo (created, updated, cancelled) vai no header
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topic.orders=orders

management.endpoints.web.exposure.include=health,info

# Centavos chegam como inteiro: 1055.5 é recusado (400) em vez de truncado para 1055
spring.jackson.deserialization.accept-float-as-int=false

# Traces (ADR 12): todas as requisições amostradas, porque é ambiente de estudo; em produção, uma fração.
# Sem endpoint, nada é exportado; o docker-compose.tools.yml aponta para o Grafana LGTM.
management.tracing.sampling.probability=1.0
# O gateway repassa o X-Correlation-Id; aqui ele vira baggage, vai para o MDC dos logs e segue no outbox.
management.tracing.baggage.remote-fields=X-Correlation-Id
management.tracing.baggage.correlation.fields=X-Correlation-Id
logging.pattern.correlation=[%X{traceId:-},%X{spanId:-},%X{X-Correlation-Id:-}] 
# Métricas por OTLP só quando há para onde mandar: o docker-compose.tools.yml liga e aponta para o LGTM.
management.otlp.metrics.export.enabled=false
