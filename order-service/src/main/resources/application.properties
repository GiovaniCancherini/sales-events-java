spring.application.name=order-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/orders
spring.datasource.username=orders
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.admin.fail-fast=true
spring.kafka.producer.properties.spring.json.type.mapping=\
  created:com.giovanicancherini.orderservice.event.OrderCreatedEvent,\
  updated:com.giovanicancherini.orderservice.event.OrderUpdatedEvent,\
  cancelled:com.giovanicancherini.orderservice.event.OrderCancelledEvent

app.kafka.topic.orders=orders

management.endpoints.web.exposure.include=health,info
