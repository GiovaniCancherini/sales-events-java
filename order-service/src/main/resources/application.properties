spring.application.name=order-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/orders
spring.datasource.username=orders
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:29092}
spring.kafka.admin.fail-fast=true
# O payload já sai do outbox em JSON; o token de tipo (created, updated, cancelled) vai no header
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topic.orders=orders

management.endpoints.web.exposure.include=health,info
